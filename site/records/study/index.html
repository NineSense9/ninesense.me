<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>备考记录 · NineSense</title>
  <link rel="stylesheet" href="./study.css">
  <script src="./study.js" defer></script>
</head>
<body>
  <header class="study-topbar"><a href="../../">NineSense</a><a href="../">MORE RECORDS / 备考记录</a></header>
  <main>
    <section id="study-today" aria-labelledby="today-title">
      <p>STUDY RECORD / 2026</p>
      <h1 id="today-title">备考记录</h1>
      <p id="study-status" aria-live="polite">正在读取今天的记录</p>
      <div id="today-task-list"></div>
    </section>
    <section id="study-overview" aria-labelledby="overview-title">
      <h2 id="overview-title">专注总览</h2>
      <div id="focus-trend"></div>
      <div id="subject-breakdown"></div>
    </section>
    <section id="study-recent" aria-labelledby="recent-title">
      <h2 id="recent-title">最近 30 天</h2>
      <div id="recent-heatmap"></div>
    </section>
    <section id="study-exams" aria-labelledby="exam-title">
      <h2 id="exam-title">考研时间表</h2>
      <ol id="exam-timeline"></ol>
    </section>
  </main>
  <footer><a href="../">返回更多记录</a><span>PUBLIC VIEW · READ ONLY</span></footer>
</body>
</html>
